<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='4' width='18' height='17' rx='4' fill='%2316304a'/%3E%3Ccircle cx='16.5' cy='9.5' r='3' fill='%23FFD24A'/%3E%3Cpath d='M5 15h4M5 18h7' stroke='%23eef4ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<title>两周日历天气组件</title>
<style>
:root {
  --ink: #16304a;
  --muted: rgba(22, 48, 74, .62);
  --faint: rgba(22, 48, 74, .40);
  --line: rgba(22, 48, 74, .10);
  --rest: #c45c4a;
  --rest-soft: rgba(196, 92, 74, .12);
  --work: #3d6fe0;
  --work-soft: rgba(61, 111, 224, .10);
  --wash: rgba(255, 255, 255, .34);
  --glass: linear-gradient(180deg, rgba(255,255,255,.50) 0%, rgba(255,255,255,.20) 46%, rgba(255,255,255,.30) 100%);
  --glass-3: linear-gradient(165deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.06) 48%, rgba(255,255,255,.14) 100%);
  --glass-stroke: rgba(255, 255, 255, .42);
  --stroke: rgba(255, 255, 255, .60);
  --inset: rgba(255, 255, 255, .78);
  --blob: rgba(170, 196, 220, .38);
  --today-1: rgba(22, 48, 74, .92);
  --today-2: rgba(22, 48, 74, .78);
  --shadow: 0 14px 34px rgba(28, 52, 84, .14);
  --panel-bg: rgba(245, 249, 255, .97);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eef4ff;
    --muted: rgba(226, 236, 255, .62);
    --faint: rgba(226, 236, 255, .38);
    --line: rgba(226, 236, 255, .12);
    --rest: #e27466;
    --rest-soft: rgba(226, 116, 102, .16);
    --work: #8aa4ff;
    --work-soft: rgba(138, 164, 255, .14);
    --wash: rgba(255, 255, 255, .10);
    --glass: linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(16,26,46,.30) 46%, rgba(255,255,255,.08) 100%);
    --glass-3: linear-gradient(165deg, rgba(255,255,255,.13) 0%, rgba(12,20,36,.18) 48%, rgba(255,255,255,.06) 100%);
    --glass-stroke: rgba(255, 255, 255, .18);
    --stroke: rgba(255, 255, 255, .22);
    --inset: rgba(255, 255, 255, .30);
    --blob: rgba(110, 130, 255, .40);
    --today-1: rgba(255, 255, 255, .28);
    --today-2: rgba(255, 255, 255, .13);
    --shadow: 0 14px 34px rgba(4, 10, 22, .45);
    --panel-bg: rgba(18, 26, 44, .97);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: transparent; }
body {
  width: fit-content;
  min-width: 320px;
  color: var(--ink);
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.glass-defs { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
.widget {
  position: relative;
  isolation: isolate;
  width: 520px;
  max-width: 100vw;
  margin: 0;
  border-radius: 28px;
  overflow: hidden;
  background: var(--glass);
  border: .5px solid var(--stroke);
  box-shadow: inset 0 1px 0 var(--inset), var(--shadow);
  backdrop-filter: blur(28px) saturate(1.7);
  -webkit-backdrop-filter: blur(28px) saturate(1.7);
}
.widget::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(92% 58% at 90% -12%, var(--blob), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,.22), transparent 34%);
}
.widget[data-sky="sun"]   { --blob: rgba(255, 196, 70, .42); }
.widget[data-sky="cloud"] { --blob: rgba(170, 196, 220, .38); }
.widget[data-sky="rain"]  { --blob: rgba(70, 150, 230, .38); }
.widget[data-sky="storm"] { --blob: rgba(120, 110, 230, .40); }
.widget[data-sky="snow"]  { --blob: rgba(180, 220, 255, .42); }
.widget[data-sky="fog"]   { --blob: rgba(190, 200, 210, .36); }
.widget[data-sky="night"] { --blob: rgba(110, 130, 255, .40); }
.widget > * { position: relative; z-index: 1; }

/* ---------- 天气头部 ---------- */
.weather-header { padding: 20px 22px 15px; }
.weather-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.place {
  min-width: 0;
  display: flex; align-items: center;
  gap: 5px;
  font-size: 14px; font-weight: 650; letter-spacing: .03em;
  flex: 1;
  cursor: pointer;
}
.place svg { flex: none; width: 13px; height: 13px; opacity: .6; }
.place b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-meta {
  flex: none;
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 2px; line-height: 1.1;
}
.top-year {
  font-size: 13px; font-weight: 700; letter-spacing: .04em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.update-time { font-size: 11px; color: var(--muted); white-space: nowrap; }

.weather-main {
  margin-top: 8px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
}
.weather-main > div:first-child { min-width: 0; overflow: hidden; }
.temp {
  display: flex; align-items: flex-start;
  font-size: 58px; font-weight: 240;
  line-height: .86; letter-spacing: -.06em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px rgba(255,255,255,.35);
}
.temp small { margin-top: 8px; font-size: 24px; font-weight: 300; letter-spacing: 0; }
.cond { margin-top: 5px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.meta-line { margin-top: 3px; font-size: 11px; font-weight: 560; color: var(--muted); white-space: nowrap; }

/* ---------- 玻璃折射 ---------- */
.clock, .chip {
  background: var(--glass-3);
  border: .5px solid var(--glass-stroke);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.50),
    inset 0 -1px 0 rgba(255,255,255,.10),
    0 3px 10px rgba(24,46,78,.06);
  backdrop-filter: blur(3px) saturate(1.7);
  -webkit-backdrop-filter: blur(3px) saturate(1.7);
}
@supports (backdrop-filter: url(#glassWarp)) {
  .clock, .chip { backdrop-filter: url(#glassWarp) blur(2px) saturate(1.7); }
}
@supports (-webkit-backdrop-filter: url(#glassWarp)) {
  .clock, .chip { -webkit-backdrop-filter: url(#glassWarp) blur(2px) saturate(1.7); }
}
@media (prefers-color-scheme: dark) {
  .clock, .chip {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.04),
      0 3px 10px rgba(0,0,0,.22);
  }
}
.clock {
  justify-self: center;
  display: flex; flex-direction: column; align-items: center;
  gap: 5px;
  padding: 12px 20px 11px;
  border-radius: 18px;
}
.clock-time {
  font-size: 36px; font-weight: 300;
  line-height: 1; letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  text-shadow: 0 1px 2px rgba(255,255,255,.35);
  white-space: nowrap;
}
.clock-time small {
  font-size: 20px; font-weight: 400;
  color: var(--muted);
  margin-left: 1px;
}
.clock-label { font-size: 9px; letter-spacing: 2px; color: var(--faint); white-space: nowrap; }

.art { width: 92px; height: 92px; justify-self: end; flex: none; pointer-events: none; }
.art svg {
  width: 92px; height: 92px; display: block;
  filter: drop-shadow(0 10px 16px rgba(40,70,110,.18));
}
@media (prefers-color-scheme: dark) {
  .temp, .clock-time, .top-year {
    text-shadow: 0 1px 2px rgba(8,14,28,.7), 0 4px 14px rgba(8,14,28,.4);
  }
  .art { filter: brightness(.92); }
}

.chips { margin-top: 12px; display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  padding: 6px 11px; border-radius: 11px;
  font-size: 11px; font-weight: 540;
  color: var(--muted);
  white-space: nowrap;
}
.chip strong { color: var(--ink); font-weight: 680; margin-left: 2px; }

.weather-error {
  display: none; align-items: center; gap: 9px;
  margin-top: 10px; font-size: 12px; color: var(--rest);
}
.weather-error.show { display: flex; }
.weather-error button {
  border: .5px solid currentColor; border-radius: 999px;
  background: transparent; color: inherit;
  font: inherit; font-size: 11px; padding: 3px 12px; cursor: pointer;
}

/* ---------- 日历头部 ---------- */
.divider { height: .5px; margin: 0 22px; background: var(--line); }
.calendar-header {
  padding: 12px 22px 7px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.calendar-title {
  font-size: 19px; font-weight: 700; letter-spacing: .04em;
  flex: none;
  cursor: pointer;
  position: relative;
  padding-right: 14px;
}
.calendar-title::after {
  content: "";
  position: absolute;
  right: 0; top: 50%;
  width: 6px; height: 6px;
  margin-top: -5px;
  border-right: 1.6px solid var(--muted);
  border-bottom: 1.6px solid var(--muted);
  transform: rotate(45deg);
  opacity: .7;
}
.calendar-sub {
  min-width: 0; font-size: 11px; color: var(--muted);
  text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- 两周卡片 ---------- */
.calendar { padding: 0 13px 15px; }
.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: 4px;
  align-items: stretch;
}
.week:last-child { margin-bottom: 0; }
.day {
  position: relative;
  min-width: 0;
  min-height: 94px;
  padding: 5px 2px;
  border-radius: 15px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  overflow: hidden;
  cursor: pointer;
  transition: background .18s, box-shadow .18s;
  will-change: background, box-shadow;
}
@media (hover: hover) { .day:hover { background: var(--wash); } }
.d-top {
  width: 100%;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) 14px;
  align-items: center;
  height: 14px; margin-bottom: 1px; flex: none;
}
.weekday {
  grid-column: 2; text-align: center;
  font-size: 9.5px; font-weight: 560;
  color: var(--faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.date-num {
  position: relative;
  width: 26px; height: 26px; flex: none;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  font-weight: 660;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  transition: color .18s, background .18s;
}
.lunar {
  margin-top: 1px; width: 100%; line-height: 1.2;
  font-size: 9px; text-align: center;
  color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: none;
}
.d-icon {
  height: 15px; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  color: #72869e;
  flex: none;
}
.d-icon svg { width: 15px; height: 15px; display: block; }
@media (prefers-color-scheme: dark) { .d-icon { color: #aebfd6; } }
.d-temp {
  margin-top: 1px; font-size: 9px; line-height: 1.2; font-weight: 560;
  color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums;
  flex: none;
}

.day.sat .weekday, .day.sun .weekday { color: var(--rest); }
.day.sat .date-num, .day.sun .date-num { color: var(--rest); }
.day.rest-day { background: var(--rest-soft); }
@media (hover: hover) { .day.rest-day:hover { background: var(--rest-soft); } }
.day.rest-day .date-num { color: var(--rest); }
.day.rest-day .lunar { color: var(--rest); }

.badge { grid-column: 3; justify-self: end; margin-right: 2px; font-size: 9px; font-weight: 700; line-height: 1; }
.badge.rest { color: var(--rest); }
.badge.work { color: var(--work); }

.day.is-real-today .date-num::after {
  content: "";
  position: absolute;
  bottom: -3px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--ink); opacity: .55;
}

.day.selected {
  background: linear-gradient(160deg, var(--today-1), var(--today-2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 14px rgba(20,40,70,.18);
}
.day.selected .weekday,
.day.selected .lunar,
.day.selected .d-temp { color: rgba(255,255,255,.66); }
.day.selected .d-icon { color: rgba(255,255,255,.88); }
.day.selected .date-num { background: #fff; color: #16304a; }
.day.selected.rest-day .date-num { background: #fff; color: var(--rest); }
.day.selected.sat .weekday, .day.selected.sun .weekday { color: rgba(255,255,255,.85); }
.day.selected .badge.rest { color: #ffd2cc; }
.day.selected .badge.work { color: #aec4ff; }
.day.selected.is-real-today .date-num::after { display: none; }

/* ---------- 整月面板 ---------- */
.month-panel {
  position: absolute; inset: 0;
  z-index: 20;
  border-radius: 28px;
  background: var(--panel-bg);
  backdrop-filter: blur(40px) saturate(1.6);
  -webkit-backdrop-filter: blur(40px) saturate(1.6);
  display: flex; flex-direction: column;
  padding: 14px 14px 10px;
  opacity: 0;
  transform: scale(.98);
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
  touch-action: pan-y;
  will-change: opacity, transform;
}
.month-panel.show { opacity: 1; transform: scale(1); pointer-events: auto; }

.mp-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-bottom: 6px; flex: none;
}
.mp-title {
  font-size: 16px; font-weight: 700; letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}
.mp-close {
  border: none; background: transparent; color: var(--muted);
  font: inherit; font-size: 22px; line-height: 1; padding: 0 6px; cursor: pointer;
}
.mp-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  text-align: center;
  font-size: 11px; font-weight: 620;
  color: var(--muted);
  padding: 4px 0 5px;
  border-bottom: .5px solid var(--line);
  flex: none;
}
.mp-weekdays span:nth-child(1),
.mp-weekdays span:nth-child(7) { color: var(--rest); }
.mp-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 1fr;
  gap: 3px;
  margin-top: 5px;
  min-height: 0;
  overflow: hidden;
}
.mp-cell {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 9px;
  padding: 2px;
  min-height: 0;
  cursor: pointer;
  transition: background .15s;
}
.mp-cell.empty { visibility: hidden; pointer-events: none; }
.mp-cell.sun .mp-day, .mp-cell.sat .mp-day { color: var(--rest); }
.mp-cell.rest { background: var(--rest-soft); }
.mp-cell.rest .mp-day, .mp-cell.rest .mp-lunar { color: var(--rest); }
.mp-cell.work { background: var(--work-soft); }
.mp-cell.work .mp-day { color: var(--work); }
.mp-cell.today .mp-day {
  background: var(--ink); color: #fff;
  border-radius: 50%;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
}
.mp-cell.selected { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
.mp-day {
  font-size: 13px; font-weight: 660; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.mp-lunar {
  font-size: 8.5px; color: var(--muted); margin-top: 2px; line-height: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.mp-badge {
  position: absolute; top: 1px; right: 3px;
  font-size: 8px; font-weight: 700; line-height: 1;
}
.mp-badge.rest { color: var(--rest); }
.mp-badge.work { color: var(--work); }
.mp-hint {
  padding-top: 6px;
  text-align: center; font-size: 10px; color: var(--faint); letter-spacing: .02em;
  flex: none;
}

/* ---------- 加载动画 ---------- */
.dots { display: inline-flex; gap: 5px; }
.dots i {
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; opacity: .5;
  animation: pulse 1s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: .25; }
  40% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .dots i, .wx .spin, .wx .drift, .wx .fall, .wx .flash, .wx .float {
    animation: none !important;
  }
  .day, .month-panel { transition: none; }
}

/* ---------- 窄屏 ---------- */
@media (max-width: 400px) {
  .weather-header { padding: 16px 17px 12px; }
  .weather-main { gap: 5px; }
  .temp { font-size: 46px; }
  .temp small { font-size: 20px; }
  .top-year { font-size: 12px; }
  .update-time { font-size: 10px; }
  .clock { padding: 9px 13px 8px; border-radius: 14px; gap: 4px; }
  .clock-time { font-size: 28px; }
  .clock-time small { font-size: 15px; }
  .clock-label { font-size: 8px; letter-spacing: 1.5px; }
  .art, .art svg { width: 74px; height: 74px; }
  .calendar { padding-left: 9px; padding-right: 9px; }
  .calendar-header { padding: 9px 16px 6px; }
  .calendar-sub { font-size: 9.5px; max-width: 62%; }
  .day { min-height: 90px; }
  .d-top { grid-template-columns: 12px minmax(0, 1fr) 12px; }
  .month-panel { padding: 11px 11px 8px; }
  .mp-day { font-size: 12px; }
  .mp-lunar { font-size: 8px; }
  .mp-cell.today .mp-day { width: 20px; height: 20px; }
}
@media (max-width: 340px) {
  .art, .art svg { width: 64px; height: 64px; }
  .clock-time { font-size: 24px; }
  .clock-time small { font-size: 13px; }
}
</style>
</head>
<body>

<svg class="glass-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="glassWarp" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.017" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="widget" id="widget" data-sky="cloud">

  <section class="weather-header">
    <div class="weather-top">
      <div class="place" id="place" title="长按切换城市">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M6 1.2c1.9 0 3.5 1.5 3.5 3.4 0 2.4-3.5 6.2-3.5 6.2S2.5 7 2.5 4.6C2.5 2.7 4.1 1.2 6 1.2z" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="6" cy="4.6" r="1.1" fill="currentColor"/>
        </svg>
        <b id="location">定位中…</b>
      </div>
      <div class="top-meta">
        <div class="top-year" id="clockYear">----年</div>
        <div class="update-time" id="updateTime">
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>

    <div class="weather-main">
      <div>
        <div class="temp" id="temp">--<small>°</small></div>
        <div class="cond" id="cond">正在获取天气</div>
        <div class="meta-line" id="metaLine">&nbsp;</div>
      </div>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--<small>:--</small></div>
        <div class="clock-label">本地时间</div>
      </div>
      <div class="art" id="art"></div>
    </div>

    <div class="chips">
      <div class="chip">体感<strong id="chipFeel">--</strong>°</div>
      <div class="chip">湿度<strong id="chipHum">--</strong>%</div>
      <div class="chip">风力<strong id="chipWind">--</strong></div>
    </div>

    <div class="weather-error" id="weatherError">
      <span>天气暂时获取失败</span>
      <button type="button" id="retryBtn">重试</button>
    </div>
  </section>

  <div class="divider"></div>

  <section class="calendar-header">
    <div class="calendar-title" id="monthTitle">日历</div>
    <div class="calendar-sub" id="todayText">--</div>
  </section>

  <section class="calendar">
    <div class="week" id="week1"></div>
    <div class="week" id="week2"></div>
  </section>

  <div class="month-panel" id="monthPanel">

  if (code <= 77) return '雪';
  if (code <= 82) return '阵雨';
  if (code <= 86) return '阵雪';
  if (code >= 95) return '雷雨';
  return '天气';
}
function windLevel(kmh) {
  var v = Number(kmh) || 0;
  if (v < 1) return 0;
  if (v <= 5) return 1;
  if (v <= 11) return 2;
  if (v <= 19) return 3;
  if (v <= 28) return 4;
  if (v <= 38) return 5;
  if (v <= 49) return 6;
  if (v <= 61) return 7;
  return 8;
}
function windDir(deg) {
  return WDIR[Math.round(((Number(deg) % 360) + 360) / 45) % 8];
}

/* =========================================================
   网络
========================================================= */
function fetchJson(url) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onload = function () {
      if (done) return;
      done = true;
      if (x.status >= 200 && x.status < 300) {
        try { resolve(JSON.parse(x.responseText)); }
        catch (e) { reject(e); }
      } else {
        reject(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = x.ontimeout = function () {
      if (!done) { done = true; reject(new Error('network')); }
    };
    x.send();
  });
}

function weatherUrl(base, lat, lon) {
  return base +
    '?latitude=' + lat +
    '&longitude=' + lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,' +
      'weather_code,wind_speed_10m,wind_direction_10m,precipitation,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
    '&forecast_days=16' +
    '&timezone=auto' +
    '&wind_speed_unit=kmh';
}

function validateWeather(j) {
  if (!j || !j.current || !j.daily || !j.daily.time || !j.daily.time.length) {
    throw new Error('bad weather');
  }
  return j;
}

function mergeWeather(cma, global) {
  if (!cma) return global;
  if (!global) return cma;

  var gd = global.daily;
  var gm = {};
  gd.time.forEach(function (k, i) { gm[k] = i; });

  var cd = cma.daily;
  var keys = cd.time.slice();
  Object.keys(gm).forEach(function (k) {
    if (keys.indexOf(k) === -1) keys.push(k);
  });
  keys.sort();

  var d = {
    time: [], weather_code: [],
    temperature_2m_max: [], temperature_2m_min: []
  };

  keys.forEach(function (k) {
    var ci = cd.time.indexOf(k);
    var gi = gm[k];
    function pick(field) {
      if (ci >= 0 && cd[field][ci] != null) return cd[field][ci];
      if (gi != null && gd[field][gi] != null) return gd[field][gi];
      return null;
    }
    d.time.push(k);
    d.weather_code.push(pick('weather_code'));
    d.temperature_2m_max.push(pick('temperature_2m_max'));
    d.temperature_2m_min.push(pick('temperature_2m_min'));
  });

  var cur = (global.current && global.current.temperature_2m != null)
    ? global.current : (cma.current || global.current);

  return { current: cur, daily: d };
}

function fetchWeather(lat, lon) {
  var cmaP = fetchJson(weatherUrl('https://api.open-meteo.com/v1/cma', lat, lon))
    .then(validateWeather).catch(function () { return null; });
  var glbP = fetchJson(weatherUrl('https://api.open-meteo.com/v1/forecast', lat, lon))
    .then(validateWeather).catch(function () { return null; });

  return Promise.all([cmaP, glbP]).then(function (r) {
    var out = mergeWeather(r[0], r[1]);
    if (!out || !out.current || !out.daily.time.length) {
      throw new Error('weather unavailable');
    }
    return out;
  });
}

function reverseGeocode(lat, lon) {
  var big = 'https://api.bigdatacloud.net/data/reverse-geocode-client' +
    '?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=zh';
  return fetchJson(big).then(function (j) {
    var name = j && (j.city || j.locality || j.principalSubdivision);
    if (name) return name;
    throw new Error('empty');
  }).catch(function () {
    var nom = 'https://nominatim.openstreetmap.org/reverse' +
      '?format=jsonv2&lat=' + lat + '&lon=' + lon + '&accept-language=zh-CN,zh';
    return fetchJson(nom).then(function (j) {
      var a = j && j.address;
      return (a && (a.city || a.town || a.county || a.state)) ||
        (j && j.name) || '';
    }).catch(function () { return ''; });
  });
}

function geocodeCity(name) {
  var url = 'https://geocoding-api.open-meteo.com/v1/search' +
    '?name=' + encodeURIComponent(name) + '&count=1&language=zh&format=json';
  return fetchJson(url).then(function (j) {
    var r = j && j.results && j.results[0];
    if (!r) throw new Error('not found');
    return { lat: r.latitude, lon: r.longitude, name: r.name };
  });
}

/* =========================================================
   定位
========================================================= */
function hasBridge() {
  return !!(window.webkit &&
    window.webkit.messageHandlers &&
    window.webkit.messageHandlers.themeBox);
}

window.setLocation = function (lat, lon) {
  if (state.runId && state.lastLat == null &&
      isFinite(Number(lat)) && isFinite(Number(lon))) {
    loadWeather(state.runId, Number(lat), Number(lon));
  }
};

function locate(run) {
  if (hasBridge()) {
    try { window.webkit.messageHandlers.themeBox.postMessage('getLocation'); }
    catch (e) {}
    setTimeout(function () {
      if (state.runId === run && state.lastLat == null) browserLocate(run);
    }, 4000);
    return;
  }
  browserLocate(run);
}

function browserLocate(run) {
  if (!navigator.geolocation) { ipLocate(run); return; }

  var settled = false;
  var timer = setTimeout(function () {
    if (settled) return;
    settled = true;
    ipLocate(run);
  }, 9000);

  navigator.geolocation.getCurrentPosition(
    function (pos) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (state.runId === run && state.lastLat == null) {
        loadWeather(run, pos.coords.latitude, pos.coords.longitude);
      }
    },
    function () {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      ipLocate(run);
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
}

function ipLocate(run) {
  var sources = [
    {
      url: 'https://get.geojs.io/v1/ip/geo.json',
      pick: function (j) { return [j.latitude, j.longitude, j.city || j.region || '']; }
    },
    {
      url: 'https://ipwho.is/',
      pick: function (j) { return [j.latitude, j.longitude, j.city || j.region || '']; }
    },
    {
      url: 'https://ipapi.co/json/',
      pick: function (j) { return [j.latitude, j.longitude, j.city || j.region || '']; }
    }
  ];
  var i = 0;
  function next() {
    if (i >= sources.length) {
      if (state.runId === run && state.lastLat == null) {
        loadWeather(run, 39.9042, 116.4074, '北京');
      }
      return;
    }
    var src = sources[i++];
    fetchJson(src.url).then(function (j) {
      if (state.runId !== run || state.lastLat != null) return;
      var r = src.pick(j);
      var lat = Number(r[0]);
      var lon = Number(r[1]);
      if (!isFinite(lat) || !isFinite(lon)) throw new Error('bad ip geo');
      loadWeather(run, lat, lon, null, r[2] || '');
    }).catch(function () {
      if (state.runId === run && state.lastLat == null) next();
    });
  }
  next();
}

function loadWeather(run, lat, lon, name, fallbackName) {
  if (run !== state.runId || state.lastLat != null) return;

  state.lastLat = lat;
  state.lastLon = lon;

  $('location').textContent = name || '定位成功';

  var named = name ? Promise.resolve(name)
    : reverseGeocode(lat, lon).catch(function () {
        return fallbackName || '当前位置';
      });

  Promise.all([fetchWeather(lat, lon), named]).then(function (res) {
    if (run !== state.runId) return;

    state.weather = res[0];
    state.place = res[1] || fallbackName || '当前位置';

    renderWeather(state.weather, state.place);
    state.wmap = buildWeatherMap(state.weather);
    renderCalendar(state.wmap);

    armRefresh();
    reportHeight();
  }).catch(function () {
    if (run === state.runId) showError();
  });
}

/* =========================================================
   天气渲染
========================================================= */
function buildWeatherMap(data) {
  var map = {};
  var t = data.daily.time;
  var c = data.daily.weather_code;
  var hi = data.daily.temperature_2m_max;
  var lo = data.daily.temperature_2m_min;
  for (var i = 0; i < t.length; i++) {
    map[t[i]] = { code: c[i], hi: hi[i], lo: lo[i] };
  }
  return map;
}

function renderWeather(data, name) {
  var cur = data.current;
  var code = cur.weather_code;
  var isDay = cur.is_day === 1;

  $('widget').dataset.sky = skyOf(code, isDay);
  $('location').textContent = name;
  $('art').innerHTML = wxIcon(code, isDay, 92);
  $('temp').innerHTML = safeRound(cur.temperature_2m, '--') + '<small>°</small>';
  $('cond').textContent = textOf(code);

  var d0hi = data.daily.temperature_2m_max[0];
  var d0lo = data.daily.temperature_2m_min[0];
  $('metaLine').textContent = (d0hi != null && d0lo != null)
    ? '今日 ' + round(d0hi) + '° / ' + round(d0lo) + '°'
    : '\u00A0';

  $('chipFeel').textContent = safeRound(cur.apparent_temperature, '--');
  $('chipHum').textContent = safeRound(cur.relative_humidity_2m, '--');
  $('chipWind').textContent = windDir(cur.wind_direction_10m) + '风 ' +
    windLevel(cur.wind_speed_10m) + ' 级';

  var now = new Date();
  $('updateTime').textContent = pad(now.getHours()) + ':' +
    pad(now.getMinutes()) + ' 更新';

  $('weatherError').classList.remove('show');
}

/* =========================================================
   两周卡片
========================================================= */
function dayHtml(d, realToday, wmap) {
  var past = d < realToday;
  var key = ymd(d);
  var dow = d.getDay();

  var restLabel = restOf(d);
  var workLabel = workOf(d);
  var isRest = !!restLabel;
  var isWork = !!workLabel;

  var cls = 'day';
  if (dow === 0 && !isWork) cls += ' sun';
  else if (dow === 6 && !isWork) cls += ' sat';
  if (+d === +realToday) cls += ' is-real-today';
  if (state.selected && +d === +state.selected) cls += ' selected';
  if (isRest) cls += ' rest-day';

  var badge;
  if (isRest) badge = '<span class="badge rest">休</span>';
  else if (isWork) badge = '<span class="badge work">班</span>';
  else badge = '<span></span>';

  var w = (!past && wmap && wmap[key] && wmap[key].code != null) ? wmap[key] : null;

  var icon = w
    ? '<span class="d-icon">' + wxIcon(w.code, 1, 15) + '</span>'
    : '<span class="d-icon"></span>';

  var temp = (w && w.hi != null && w.lo != null)
    ? '<div class="d-temp">' + round(w.hi) + '° / ' + round(w.lo) + '°</div>'
    : '<div class="d-temp">\u00A0</div>';

  return '<div class="' + cls + '" data-d="' + key + '">' +
    '<div class="d-top">' +
      '<span></span>' +
      '<span class="weekday">周' + WEEK[dow] + '</span>' +
      badge +
    '</div>' +
    '<div class="date-num">' + d.getDate() + '</div>' +
    '<div class="lunar">' + esc(dayLabel(d)) + '</div>' +
    icon + temp +
    '</div>';
}

function weekHtml(sun, realToday, wmap) {
  var out = [];
  for (var i = 0; i < 7; i++) {
    out.push(dayHtml(addDays(sun, i), realToday, wmap));
  }
  return out.join('');
}

/* =========================================================
   选中日期信息
========================================================= */
function renderSub(d, wmap) {
  var dow = d.getDay();
  var key = ymd(d);
  var parts = [];

  if (+d === +startOfDay(new Date())) {
    parts.push('<span style="font-weight:700">今天</span>');
  }

  parts.push('<span>' + (d.getMonth() + 1) + '月' + d.getDate() +
    '日 周' + WEEK[dow] + '</span>');

  var lu = lunarOf(d);
  var lunarName = lu.monthStr + lu.dayName;
  var label = dayLabel(d);
  parts.push('<span>' + esc(lunarName) + '</span>');

  if (label !== lunarName && label !== lu.dayName && label !== lu.monthStr) {
    parts.push('<span>' + esc(label) + '</span>');
  }

  var restLabel = restOf(d);
  var workLabel = workOf(d);

  if (restLabel) {
    var restText = label.indexOf(restLabel) >= 0 ? '休' : esc(restLabel) + ' · 休';
    parts.push('<span style="color:var(--rest)">' + restText + '</span>');
  } else if (workLabel) {
    parts.push('<span style="color:var(--work)">' + esc(workLabel) + ' · 班</span>');
  } else if (dow === 0 || dow === 6) {
    parts.push('<span style="color:var(--rest)">周末</span>');
  } else {
    parts.push('<span style="color:var(--faint)">工作日</span>');
  }

  var w = wmap && wmap[key];
  if (w && w.code != null && w.hi != null && w.lo != null) {
    parts.push('<span>' + esc(textOf(w.code)) + ' ' +
      round(w.lo) + '~' + round(w.hi) + '°</span>');
  }

  $('todayText').innerHTML = parts.join(
    '<span style="color:var(--faint)"> · </span>'
  );
}

/* =========================================================
   双周日历
========================================================= */
function bindDays(wmap) {
  var days = document.querySelectorAll('.day[data-d]');
  for (var i = 0; i < days.length; i++) {
    (function (el) {
      el.addEventListener('click', function () {
        var p = el.getAttribute('data-d').split('-');
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        selectDate(d, wmap, false);
      });
    })(days[i]);
  }
}

function selectDate(d, wmap, moveAnchor) {
  if (state.selected && +state.selected === +d && !moveAnchor) return;

  var prev = document.querySelector('.day.selected');
  if (prev) prev.classList.remove('selected');

  var next = document.querySelector('.day[data-d="' + ymd(d) + '"]');
  if (next) next.classList.add('selected');

  state.selected = d;
  state.userSelected = +d !== +startOfDay(new Date());

  if (moveAnchor) {
    state.anchor = d;
    renderCalendar(wmap);
  } else {
    $('monthTitle').textContent = (d.getMonth() + 1) + '月';
    $('clockYear').textContent = d.getFullYear() + '年';
    renderSub(d, wmap);
  }
  reportHeight();
}

function renderCalendar(wmap) {
  var realToday = startOfDay(new Date());
  var anchor = state.anchor ? startOfDay(state.anchor) : realToday;

  if (!state.userSelected || !state.selected) {
    state.selected = anchor;
  }

  var sel = state.selected;
  var sun = new Date(
    anchor.getFullYear(), anchor.getMonth(),
    anchor.getDate() - anchor.getDay()
  );

  $('monthTitle').textContent = (anchor.getMonth() + 1) + '月';
  $('clockYear').textContent = anchor.getFullYear() + '年';

  $('week1').innerHTML = weekHtml(sun, realToday, wmap);
  $('week2').innerHTML = weekHtml(addDays(sun, 7), realToday, wmap);

  renderSub(sel, wmap);
  bindDays(wmap);
}

/* =========================================================
   整月面板
========================================================= */
function renderMonth(year, month, wmap) {
  wmap = wmap || state.wmap;

  var first = new Date(year, month, 1);
  var startDow = first.getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();

  var realToday = startOfDay(new Date());
  var selKey = state.selected ? ymd(state.selected) : '';

  var buf = [];
  var i;

  for (i = 0; i < startDow; i++) {
    buf.push('<div class="mp-cell empty"></div>');
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var date = new Date(year, month, d);
    var key = ymd(date);
    var dow = date.getDay();

    var restLabel = restOf(date);
    var workLabel = workOf(date);
    var isRest = !!restLabel;
    var isWork = !!workLabel;
    var label = dayLabel(date);
    var isToday = +date === +realToday;
    var isSelected = key === selKey;

    var cls = 'mp-cell';
    if (dow === 0 && !isWork) cls += ' sun';
    if (dow === 6 && !isWork) cls += ' sat';
    if (isRest) cls += ' rest';
    if (isWork) cls += ' work';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    var badge = '';
    if (isRest) badge = '<span class="mp-badge rest">休</span>';
    else if (isWork) badge = '<span class="mp-badge work">班</span>';

    buf.push('<div class="' + cls + '" data-d="' + key + '">' +
      badge +
      '<div class="mp-day">' + d + '</div>' +
      '<div class="mp-lunar">' + esc(label) + '</div>' +
      '</div>');
  }

  $('mpTitle').textContent = year + '年' + (month + 1) + '月';
  $('mpGrid').innerHTML = buf.join('');
  bindMonthCells(wmap);
}

function bindMonthCells(wmap) {
  var cells = document.querySelectorAll('.mp-cell[data-d]');
  for (var i = 0; i < cells.length; i++) {
    (function (el) {
      el.addEventListener('click', function () {
        var p = el.getAttribute('data-d').split('-');
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        closeMonthPanel();
        state.userSelected = true;
        selectDate(d, wmap, true);
      });
    })(cells[i]);
  }
}

function openMonthPanel() {
  var anchor = state.anchor ? startOfDay(state.anchor) : startOfDay(new Date());
  mpState.year = anchor.getFullYear();
  mpState.month = anchor.getMonth();
  renderMonth(mpState.year, mpState.month, state.wmap);
  $('monthPanel').classList.add('show');
  reportHeight();
}

function closeMonthPanel() {
  $('monthPanel').classList.remove('show');
  reportHeight();
}

function shiftMonth(delta) {
  var m = mpState.month + delta;
  var y = mpState.year;
  if (m < 0) { m += 12; y -= 1; }
  if (m > 11) { m -= 12; y += 1; }
  mpState.year = y;
  mpState.month = m;
  renderMonth(y, m, state.wmap);
}

/* =========================================================
   状态 / 刷新
========================================================= */
function setLoadingUI() {
  $('updateTime').innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  $('weatherError').classList.remove('show');
}
function showError() {
  $('weatherError').classList.add('show');
  $('updateTime').textContent = '更新失败';
  reportHeight();
}
function start() {
  var run = ++state.runId;
  state.lastLat = null;
  setLoadingUI();
  locate(run);
}
function reload(silent) {
  if (state.lastLat == null || state.lastLon == null) { start(); return; }

  var lat = state.lastLat;
  var lon = state.lastLon;
  var place = state.place;

  var run = ++state.runId;
  state.lastLat = null;

  if (!silent) setLoadingUI();
  loadWeather(run, lat, lon, place);
}
function switchCity(name) {
  if (!name) return;
  setLoadingUI();
  geocodeCity(name).then(function (r) {
    var run = ++state.runId;
    state.lastLat = null;
    state.lastLon = null;
    loadWeather(run, r.lat, r.lon, r.name);
  }).catch(function () {
    $('updateTime').textContent = '未找到该城市';
  });
}
function armRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function () { reload(true); }, 30 * 60 * 1000);
}

/* =========================================================
   事件绑定
========================================================= */
$('retryBtn').addEventListener('click', function () { start(); });

$('monthTitle').addEventListener('click', function () { openMonthPanel(); });
$('mpClose').addEventListener('click', function () { closeMonthPanel(); });

/* 整月面板左右滑动切换月份 */
(function () {
  var panel = $('monthPanel');
  var sx = 0, sy = 0, moved = false;

  panel.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    moved = false;
  }, { passive: true });

  panel.addEventListener('touchmove', function () {
    moved = true;
  }, { passive: true });

  panel.addEventListener('touchend', function (e) {
    if (!moved) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      shiftMonth(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  var mDown = false, mx = 0;
  panel.addEventListener('mousedown', function (e) {
    mDown = true;
    mx = e.clientX;
  });
  panel.addEventListener('mouseup', function (e) {
    if (!mDown) return;
    mDown = false;
    var dx = e.clientX - mx;
    if (Math.abs(dx) > 60) shiftMonth(dx < 0 ? 1 : -1);
  });
})();

/* 长按位置 → 切换城市 */
(function () {
  var el = $('place');
  var timer = 0;
  var longPressed = false;

  function startPress() {
    longPressed = false;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = 0;
      longPressed = true;
      var name = window.prompt(
        '输入城市名（例：上海 / 广州 / 杭州）',
        state.place || ''
      );
      if (name && name.trim()) switchCity(name.trim());
    }, 700);
  }
  function cancelPress() {
    if (timer) { clearTimeout(timer); timer = 0; }
  }

  el.addEventListener('touchstart', function (e) {
    e.preventDefault();
    startPress();
  }, { passive: false });
  el.addEventListener('touchend', cancelPress);
  el.addEventListener('touchcancel', cancelPress);
  el.addEventListener('touchmove', cancelPress, { passive: true });

  el.addEventListener('mousedown', startPress);
  el.addEventListener('mouseup', cancelPress);
  el.addEventListener('mouseleave', cancelPress);
  el.addEventListener('click', function (e) {
    if (longPressed) e.stopPropagation();
  });
})();

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && state.weather) reload(true);
});

if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme = function () {
    if (state.weather) {
      renderWeather(state.weather, state.place);
      renderCalendar(state.wmap);
      if ($('monthPanel').classList.contains('show')) {
        renderMonth(mpState.year, mpState.month, state.wmap);
      }
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}

/* =========================================================
   高度上报（防抖）
========================================================= */
var lastHeight = 0;
function reportHeightImpl() {
  var h = $('widget').offsetHeight;
  if (h === lastHeight) return;
  lastHeight = h;
  try { window.parent.postMessage({ height: h }, '*'); }
  catch (e) {}
}
var reportHeight = debounce(reportHeightImpl, 80);

window.addEventListener('resize', reportHeight);
window.addEventListener('orientationchange', function () {
  setTimeout(reportHeight, 300);
});

if (window.ResizeObserver) {
  new ResizeObserver(reportHeight).observe($('widget'));
}

/* =========================================================
   时钟（用 requestAnimationFrame 对齐秒针，更流畅）
========================================================= */
var lastSec = -1;
function tickClock() {
  var n = new Date();
  var s = n.getSeconds();
  if (s !== lastSec) {
    lastSec = s;
    $('clockTime').innerHTML = pad(n.getHours()) + ':' +
      pad(n.getMinutes()) + '<small>:' + pad(s) + '</small>';
  }
}
tickClock();
setInterval(tickClock, 250);

/* =========================================================
   启动
========================================================= */
renderCalendar(null);
reportHeight();
start();

})();
</script>

</body>
</html>
